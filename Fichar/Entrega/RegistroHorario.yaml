openapi: 3.0.0
info:
  title: API Registro Horario
  description: Servicios REST para gestionar usuarios, trabajos, fichajes y claves de API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor local nodejs

tags:
  - name: Usuarios
  - name: Trabajos
  - name: Fichajes
  - name: ApiKey
  - name: Login

paths:
  # ---------------------------------------------------------------- USUARIOS
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Lista todos los usuarios
      operationId: getUsuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags: [Usuarios]
      summary: Crea un usuario
      operationId: addUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    put:
      tags: [Usuarios]
      summary: Actualiza un usuario (el id va en el body)
      operationId: updateUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
  /usuarios/{idUsuario}:
    get:
      tags: [Usuarios]
      summary: Obtiene un usuario por id
      operationId: getUsuarioById
      parameters:
        - $ref: '#/components/parameters/idUsuario'
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    delete:
      tags: [Usuarios]
      summary: Borra un usuario
      operationId: deleteUsuario
      parameters:
        - $ref: '#/components/parameters/idUsuario'
      responses:
        '200':
          description: Usuario borrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  # ---------------------------------------------------------------- TRABAJOS
  /trabajos:
    get:
      tags: [Trabajos]
      summary: Lista todos los trabajos
      operationId: getTrabajos
      responses:
        '200':
          description: Lista de trabajos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trabajo'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags: [Trabajos]
      summary: Crea un trabajo
      operationId: addTrabajo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trabajo'
      responses:
        '201':
          description: Trabajo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    put:
      tags: [Trabajos]
      summary: Actualiza un trabajo (el id va en el body)
      operationId: updateTrabajo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trabajo'
      responses:
        '200':
          description: Trabajo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
  /trabajos/{idTrabajo}:
    get:
      tags: [Trabajos]
      summary: Obtiene un trabajo por id
      operationId: getTrabajoById
      parameters:
        - $ref: '#/components/parameters/idTrabajo'
      responses:
        '200':
          description: Trabajo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    delete:
      tags: [Trabajos]
      summary: Borra un trabajo
      operationId: deleteTrabajo
      parameters:
        - $ref: '#/components/parameters/idTrabajo'
      responses:
        '200':
          description: Trabajo borrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  # ---------------------------------------------------------------- FICHAJES
  /fichajes:
    get:
      tags: [Fichajes]
      summary: Lista fichajes con filtros opcionales
      description: >
        Todos los filtros son opcionales y combinables.
        Con soloAbierto=true devuelve solo fichajes sin salida cuya entrada
        sea de las últimas 12 horas.
      operationId: getFichajes
      parameters:
        - in: query
          name: idUsuario
          schema:
            type: integer
        - in: query
          name: fechaDesde
          description: Formato YYYY-MM-DD
          schema:
            type: string
            format: date
        - in: query
          name: fechaHasta
          description: Formato YYYY-MM-DD
          schema:
            type: string
            format: date
        - in: query
          name: soloAbierto
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de fichajes (incluye NombreUsuario y NombreTrabajo)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fichaje'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags: [Fichajes]
      summary: Abre un fichaje (la entrada se pone con NOW() en el servidor)
      operationId: addFichaje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FichajeNuevo'
      responses:
        '201':
          description: Fichaje creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fichaje'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    put:
      tags: [Fichajes]
      summary: Actualiza un fichaje completo (uso de administración)
      operationId: updateFichaje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fichaje'
      responses:
        '200':
          description: Fichaje actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fichaje'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
  /fichajes/{idFichaje}:
    get:
      tags: [Fichajes]
      summary: Obtiene un fichaje por id
      operationId: getFichajeById
      parameters:
        - $ref: '#/components/parameters/idFichaje'
      responses:
        '200':
          description: Fichaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fichaje'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    delete:
      tags: [Fichajes]
      summary: Borra un fichaje
      operationId: deleteFichaje
      parameters:
        - $ref: '#/components/parameters/idFichaje'
      responses:
        '200':
          description: Fichaje borrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
  /fichajes/{idFichaje}/salida:
    put:
      tags: [Fichajes]
      summary: Cierra un fichaje (salida = NOW() y cálculo de HorasTrabajadas)
      operationId: cerrarFichaje
      parameters:
        - $ref: '#/components/parameters/idFichaje'
      responses:
        '200':
          description: Fichaje cerrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fichaje'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  # ---------------------------------------------------------------- APIKEY
  /apikeys:
    get:
      tags: [ApiKey]
      summary: Lista las claves de API
      operationId: getApiKeys
      responses:
        '200':
          description: Lista de claves
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags: [ApiKey]
      summary: Crea una clave de API
      operationId: addApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKey'
      responses:
        '201':
          description: Clave creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    put:
      tags: [ApiKey]
      summary: Actualiza una clave de API (el id va en el body)
      operationId: updateApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKey'
      responses:
        '200':
          description: Clave actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
  /apikeys/{idKey}:
    get:
      tags: [ApiKey]
      summary: Obtiene una clave por id
      operationId: getApiKeyById
      parameters:
        - $ref: '#/components/parameters/idKey'
      responses:
        '200':
          description: Clave
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    delete:
      tags: [ApiKey]
      summary: Borra una clave de API
      operationId: deleteApiKey
      parameters:
        - $ref: '#/components/parameters/idKey'
      responses:
        '200':
          description: Clave borrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  # ---------------------------------------------------------------- LOGIN
  /login:
    post:
      tags: [Login]
      summary: Valida usuario y clave contra la tabla Usuarios
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales correctas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Usuario o clave incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '500':
          $ref: '#/components/responses/ErrorServidor'

components:
  parameters:
    idUsuario:
      in: path
      name: idUsuario
      required: true
      schema:
        type: integer
    idTrabajo:
      in: path
      name: idTrabajo
      required: true
      schema:
        type: integer
    idFichaje:
      in: path
      name: idFichaje
      required: true
      schema:
        type: integer
    idKey:
      in: path
      name: idKey
      required: true
      schema:
        type: integer

  responses:
    PeticionInvalida:
      description: Datos de entrada no válidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensaje'
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensaje'
    ErrorServidor:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensaje'

  schemas:
    Usuario:
      type: object
      required: [Nombre]
      properties:
        IdUsuario:
          type: integer
        Nombre:
          type: string
          maxLength: 100
        Usuario:
          type: string
          maxLength: 50
        Clave:
          type: string
          maxLength: 50

    Trabajo:
      type: object
      required: [Nombre]
      properties:
        IdTrabajo:
          type: integer
        Nombre:
          type: string
          maxLength: 200

    Fichaje:
      type: object
      properties:
        IdFichaje:
          type: integer
        FechaHoraEntrada:
          type: string
          description: "Formato MySQL: YYYY-MM-DD HH:MM:SS"
        FechaHoraSalida:
          type: string
          nullable: true
          description: "Formato MySQL: YYYY-MM-DD HH:MM:SS (null si sigue abierto)"
        HorasTrabajadas:
          type: integer
          nullable: true
        IdTrabajo:
          type: integer
        IdUsuario:
          type: integer
        GeolocalizacionLatitud:
          type: number
          format: float
        GeolocalizacionLongitud:
          type: number
          format: float
        NombreUsuario:
          type: string
          description: Solo lectura, viene del JOIN con Usuarios
        NombreTrabajo:
          type: string
          description: Solo lectura, viene del JOIN con Trabajos

    FichajeNuevo:
      type: object
      required: [IdTrabajo, IdUsuario]
      properties:
        IdTrabajo:
          type: integer
        IdUsuario:
          type: integer
        GeolocalizacionLatitud:
          type: number
          format: float
        GeolocalizacionLongitud:
          type: number
          format: float

    ApiKey:
      type: object
      required: [Key]
      properties:
        idKey:
          type: integer
        Key:
          type: string
          maxLength: 50

    LoginRequest:
      type: object
      required: [Usuario, Clave]
      properties:
        Usuario:
          type: string
        Clave:
          type: string

    LoginResponse:
      type: object
      properties:
        IdUsuario:
          type: integer
        Nombre:
          type: string

    Mensaje:
      type: object
      properties:
        message:
          type: string
