<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Inicio</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="salir()">Salir</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Hola, {{ auth.usuario()?.Nombre }}</h2>
  <ion-button expand="block" routerLink="/registrar">Registrar fichaje</ion-button>
  <ion-button expand="block" routerLink="/consulta">Consulta fichajes</ion-button>
</ion-content>
