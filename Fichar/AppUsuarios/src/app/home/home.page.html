<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Inicio</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="salir()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Salir
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="inicio-hero">
    <ion-icon name="person-circle-outline"></ion-icon>
    <div>
      <h2>Hola, {{ auth.usuario()?.Nombre }}</h2>
      <p>{{ fecha }}</p>
    </div>
  </div>

  <div class="inicio-lista">
    <ion-card button routerLink="/registrar" class="inicio-opcion">
      <div class="inicio-cuerpo">
        <div class="inicio-icono" style="background: var(--ion-color-success)">
          <ion-icon name="time-outline"></ion-icon>
        </div>
        <div class="inicio-texto">
          <h3>Registrar fichaje</h3>
          <p>Inicia o finaliza tu jornada</p>
        </div>
        <ion-icon class="inicio-flecha" name="chevron-forward-outline"></ion-icon>
      </div>
    </ion-card>

    <ion-card button routerLink="/consulta" class="inicio-opcion">
      <div class="inicio-cuerpo">
        <div class="inicio-icono" style="background: var(--ion-color-primary)">
          <ion-icon name="list-outline"></ion-icon>
        </div>
        <div class="inicio-texto">
          <h3>Consulta fichajes</h3>
          <p>Revisa tus fichajes por fechas</p>
        </div>
        <ion-icon class="inicio-flecha" name="chevron-forward-outline"></ion-icon>
      </div>
    </ion-card>
  </div>
</ion-content>
