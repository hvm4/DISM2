<ion-app>
  <ion-split-pane contentId="main-content" [disabled]="!auth.usuario()">
  <ion-menu contentId="main-content" [disabled]="!auth.usuario()">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menú</ion-title>
      </ion-toolbar>
    </ion-header>
      <ion-content>
        <ion-list>
          <ion-menu-toggle auto-hide="false">
            <ion-item [routerDirection]="'root'" [routerLink]="'/home'">
              <ion-icon slot="start" [name]="'home'"></ion-icon>
              <ion-label>Inicio</ion-label>
            </ion-item>
            <ion-item [routerDirection]="'root'" [routerLink]="'/usuarios'">
              <ion-icon slot="start" [name]="'people'"></ion-icon>
              <ion-label>Gestión Usuarios</ion-label>
            </ion-item>
            <ion-item [routerDirection]="'root'" [routerLink]="'/trabajos'">
              <ion-icon slot="start" [name]="'briefcase'"></ion-icon>
              <ion-label>Gestión Trabajos</ion-label>
            </ion-item>
            <ion-item [routerDirection]="'root'" [routerLink]="'/fichajes'">
              <ion-icon slot="start" [name]="'time'"></ion-icon>
              <ion-label>Gestión Fichajes</ion-label>
            </ion-item>
            <ion-item button (click)="salir()">
              <ion-icon slot="start" [name]="'log-out'"></ion-icon>
              <ion-label>Cerrar sesión ({{ auth.usuario()?.Nombre }})</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
