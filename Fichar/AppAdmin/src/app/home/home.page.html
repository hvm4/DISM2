<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Administración</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="salir()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Salir
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="inicio-hero">
    <ion-icon name="person-circle-outline"></ion-icon>
    <div>
      <h2>Hola, {{ auth.usuario()?.Nombre }}</h2>
      <p>{{ fecha }}</p>
    </div>
  </div>

  <div class="inicio-lista">
    <ion-card button routerLink="/usuarios" class="inicio-opcion">
      <div class="inicio-cuerpo">
        <div class="inicio-icono" style="background: var(--ion-color-primary)">
          <ion-icon name="people-outline"></ion-icon>
        </div>
        <div class="inicio-texto">
          <h3>Usuarios</h3>
          <p>Alta, edición y baja de usuarios</p>
        </div>
        <ion-icon class="inicio-flecha" name="chevron-forward-outline"></ion-icon>
      </div>
    </ion-card>

    <ion-card button routerLink="/trabajos" class="inicio-opcion">
      <div class="inicio-cuerpo">
        <div class="inicio-icono" style="background: var(--ion-color-tertiary)">
          <ion-icon name="briefcase-outline"></ion-icon>
        </div>
        <div class="inicio-texto">
          <h3>Trabajos</h3>
          <p>Gestión de los trabajos disponibles</p>
        </div>
        <ion-icon class="inicio-flecha" name="chevron-forward-outline"></ion-icon>
      </div>
    </ion-card>

    <ion-card button routerLink="/fichajes" class="inicio-opcion">
      <div class="inicio-cuerpo">
        <div class="inicio-icono" style="background: var(--ion-color-success)">
          <ion-icon name="time-outline"></ion-icon>
        </div>
        <div class="inicio-texto">
          <h3>Fichajes</h3>
          <p>Consulta de fichajes y ubicaciones</p>
        </div>
        <ion-icon class="inicio-flecha" name="chevron-forward-outline"></ion-icon>
      </div>
    </ion-card>
  </div>
</ion-content>
