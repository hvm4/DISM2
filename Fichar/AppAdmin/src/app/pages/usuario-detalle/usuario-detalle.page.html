<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button defaultHref="/usuarios"></ion-back-button></ion-buttons>
    <ion-title>{{ id === null ? 'Nuevo usuario' : 'Usuario' }}</ion-title>
    <ion-buttons slot="end"><ion-menu-button autoHide="false"></ion-menu-button></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card class="formulario">
    <form [formGroup]="form" (ngSubmit)="guardar()">
      @if (id !== null) {
        <ion-input label="Id" labelPlacement="stacked" fill="outline" [value]="id" readonly>
          <ion-icon slot="start" name="finger-print-outline" aria-hidden="true"></ion-icon>
        </ion-input>
      }

      <ion-input label="Nombre *" labelPlacement="stacked" fill="outline" formControlName="Nombre">
        <ion-icon slot="start" name="person-outline" aria-hidden="true"></ion-icon>
      </ion-input>
      @if (form.controls.Nombre.touched && form.controls.Nombre.invalid) {
        <p class="campo-error">El nombre es obligatorio (máximo 100 caracteres)</p>
      }

      <ion-input label="Usuario" labelPlacement="stacked" fill="outline" formControlName="Usuario">
        <ion-icon slot="start" name="at-outline" aria-hidden="true"></ion-icon>
      </ion-input>

      <ion-input label="Clave" labelPlacement="stacked" fill="outline" type="password"
                 formControlName="Clave">
        <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <div class="formulario-botones">
        <ion-button fill="outline" routerLink="/usuarios">
          <ion-icon slot="start" name="close-outline"></ion-icon>
          Cancelar
        </ion-button>
        <ion-button type="submit">
          <ion-icon slot="start" name="save-outline"></ion-icon>
          Guardar
        </ion-button>
      </div>
    </form>
  </ion-card>
</ion-content>
