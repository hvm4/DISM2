<ion-content class="login-fondo">
  <div class="login-contenedor">
    <div class="login-logo">
      <ion-icon name="briefcase-outline"></ion-icon>
    </div>
    <h1 class="login-titulo">Administración</h1>
    <p class="login-subtitulo">Registro horario</p>
  
    <form class="login-tarjeta" [formGroup]="form" (ngSubmit)="entrar()">
      <ion-input label="Usuario" labelPlacement="floating" fill="outline"
                 formControlName="Usuario" autocomplete="username">
        <ion-icon slot="start" name="person-outline" aria-hidden="true"></ion-icon>
      </ion-input>

      <ion-input label="Clave" labelPlacement="floating" fill="outline" type="password"
                 formControlName="Clave" autocomplete="current-password">
        <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <ion-button type="submit" expand="block" [disabled]="cargando()">
        @if (cargando()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <ion-icon slot="start" name="log-in-outline"></ion-icon>
          Entrar
        }
      </ion-button>
    </form>
  </div>
</ion-content>
