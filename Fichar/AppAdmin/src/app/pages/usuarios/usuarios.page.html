<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <p class="lista-resumen">
    {{ usuarios().length === 1 ? '1 usuario' : usuarios().length + ' usuarios' }}
  </p>

  @for (u of usuarios(); track u.IdUsuario) {
    <ion-card class="fila">
      <div class="fila-cuerpo">
        <div class="fila-avatar">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <div class="fila-texto" [routerLink]="['/usuarios', u.IdUsuario]">
          <h2>{{ u.Nombre }}</h2>
          <p>{{ u.Usuario }}</p>
        </div>
        <ion-button fill="clear" color="danger" aria-label="Borrar usuario" (click)="borrar(u)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-button>
      </div>
    </ion-card>
  } @empty {
    <div class="vacio">
      <ion-icon name="people-outline"></ion-icon>
      <p>No hay usuarios todavía</p>
    </div>
  }

  <div class="espacio-fab"></div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/usuarios/nuevo" aria-label="Nuevo usuario">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
