<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Fichajes</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar placeholder="Buscar usuario" (ionInput)="buscar($event)"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item>
      <ion-input label="Desde" type="date" [value]="desde()" (ionChange)="cambiarDesde($event)"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Hasta" type="date" [value]="hasta()" (ionChange)="cambiarHasta($event)"></ion-input>
    </ion-item>

    @for (f of filtrados(); track f.IdFichaje) {
      <ion-item>
        <ion-label class="ion-text-wrap">
          <h2>{{ f.NombreUsuario }} · {{ f.NombreTrabajo }}</h2>
          <p>Entrada: {{ f.FechaHoraEntrada }}</p>
          <p>Salida: {{ f.FechaHoraSalida ?? 'Abierto' }}</p>
        </ion-label>
        <ion-button slot="end" fill="clear" (click)="verMapa(f)"
                    [disabled]="f.GeolocalizacionLatitud == null || f.GeolocalizacionLongitud == null">
          <ion-icon slot="icon-only" name="map"></ion-icon>
        </ion-button>
      </ion-item>
    } @empty {
      <ion-item><ion-label>No hay fichajes</ion-label></ion-item>
    }
  </ion-list>

  <ion-modal [isOpen]="mapaAbierto()" (didPresent)="pintarMapa()" (didDismiss)="cerrarMapa()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Lugar del fichaje</ion-title>
          <ion-buttons slot="end"><ion-button (click)="mapaAbierto.set(false)">Cerrar</ion-button></ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content><div id="mapa" style="height: 100%"></div></ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
